name: Apply reviewed mobile layout fix
on:
  push:
    branches: ['work/torque-fitness-premium-20260905']
    paths: ['.github/workflows/torque-mobile-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/work/torque-fitness-premium-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact reviewed CSS correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('css/premium.css')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '8aefabd2f9a400d3f5efd7b34988413bc9fa6eabd94972e122557f9bf2424007', 'Storefront changed; review before modifying'
          fix = '\n/* Allow the CT statistics to shrink and wrap on narrow phones. */\n.cthome__txt{min-width:0}\n@media(max-width:720px){.cthome__card{grid-template-columns:minmax(0,1fr)}.cthome__stats{grid-template-columns:repeat(3,minmax(0,1fr))}.cthome__stats>div{min-width:0;overflow-wrap:anywhere}}\n@media(max-width:380px){.cthome__stats{grid-template-columns:1fr;gap:8px}.cthome__stats>div{padding:12px}}\n'
          p.write_text(p.read_text() + fix)
          PY
          python3 tests/storefront/check_static.py
      - name: Commit correction without production deployment
        run: |
          git add css/premium.css
          git config user.name 'Torque storefront review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep CT statistics within narrow mobile viewports'
          git push origin HEAD:work/torque-fitness-premium-20260905
