name: Torque storefront review

on:
  push:
    branches: ['work/torque-fitness-premium-*']
  pull_request:
    paths:
      - '*.html'
      - 'css/**'
      - 'js/site.js'
      - 'js/premium.js'
      - 'tests/storefront/**'
      - '.github/workflows/torque-visual-review.yml'

permissions:
  contents: read

concurrency:
  group: torque-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out storefront
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Package public storefront for visual review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          target = Path('site-review')
          target.mkdir(exist_ok=True)
          files = list(root.glob('*.html')) + list(root.glob('*.webmanifest'))
          files += [p for p in (root/'sw.js', root/'blog-posts.json') if p.is_file()]
          for directory in ('css', 'js', 'assets', 'icons'):
              files += [p for p in (root/directory).rglob('*') if p.is_file() and not p.is_symlink()]
          with ZipFile(target/'storefront.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(set(files)):
                  archive.write(path, str(path))
          print(f'Packaged {len(set(files))} public storefront files; no deployment performed.')
          PY
      - name: Upload review bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torque-storefront-review
          path: site-review/
          retention-days: 3
          if-no-files-found: error
